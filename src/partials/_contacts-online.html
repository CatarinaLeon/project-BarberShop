<section class="section contacts-online" id="contacts">
  <div class="container container__contacts-online">
    <div class="online">
      <h2 class="online__title">Онлайн-запис</h2>
      <form action="#" class="online__form">
        <div class="online__input-wrapper">
          <input type="text" name="user" placeholder="Ім'я*" required class="online__form-input" />
          <input type="tel" name="user" placeholder="Телефон*" required class="online__form-input" />
        </div>
        <textarea name="message" placeholder="Повідомлення" class="online__form-message"></textarea>
        <button type="submit" class="online-btn btn btn-light">відправити</button>
      </form>
    </div>
    <div class="contacts">
      <h2 class="contacts__title">Контакти</h2>
      <address class="contacts__address">
        <ul class="contacts__list">
          <li class="contacts__list-item">
            <a class="contacts__list-link"
              href="https://www.google.com/maps/place/%D0%B2%D1%83%D0%BB%D0%B8%D1%86%D1%8F+%D0%92%D0%BE%D0%BB%D0%BE%D1%88%D0%BA%D0%BE%D0%B2%D0%B0,+7,+%D0%A1%D0%BE%D1%84%D1%96%D1%97%D0%B2%D1%81%D1%8C%D0%BA%D0%B0+%D0%91%D0%BE%D1%80%D1%89%D0%B0%D0%B3%D1%96%D0%B2%D0%BA%D0%B0,+%D0%9A%D0%B8%D1%97%D0%B2%D1%81%D1%8C%D0%BA%D0%B0+%D0%BE%D0%B1%D0%BB.,+08131/@50.4045703,30.3779923,17z/data=!3m1!4b1!4m5!3m4!1s0x40d4cbc58525aeeb:0x9b29e69f13437f9!8m2!3d50.4045703!4d30.380181">
              <svg class="contacts__icon" width="24" height="24">
                <use href="./images/svg/sprite.svg#icon-map-pin"></use>
              </svg>
              вул. Василькова, 7А Київ,<span class="index">08132</span>
            </a>
          </li>
          <li class="contacts__list-item">
            <a class="contacts__list-link" href="tel:+38044111111">
              <svg class="contacts__icon" width="24" height="24">
                <use href="./images/svg/sprite.svg#icon-phone"></use>
              </svg>
              +38 044 111 11 11</a>
          </li>
          <li class="contacts__list-item">
            <a class="contacts__list-link" href="mailto:barbershop@email.com">
              <svg class="contacts__icon" width="24" height="24">
                <use href="./images/svg/sprite.svg#icon-mail"></use>
              </svg>
              barbershop@email.com</a>
          </li>
        </ul>
      </address>
      <div class="contacts__wrap">
        <p class="contacts__wrap-time pre-title_light">час роботи</p>
        <p class="contacts__wrap-time-day">Щоденно з 9:00 до 22:00</p>
      </div>
    </div>
  </div>
</section>
